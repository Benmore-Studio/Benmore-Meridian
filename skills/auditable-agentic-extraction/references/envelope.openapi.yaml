# The INVARIANT provenance/result envelope for auditable agentic extraction.
#
# Copy these schemas verbatim into your project's OpenAPI contract, then code-gen
# typed clients (Go: oapi-codegen · TS: openapi-typescript · Python:
# datamodel-code-generator). The envelope NEVER changes between projects; only
# the domain `payload` does — replace the open `payload` object below with a
# `$ref` to your project's payload schema.
#
# `value` is a STRING (decimal-as-string) to avoid float drift across languages.
# `source_ref` and `origin` are REQUIRED: a conforming value cannot omit its
# traceability. `required: [page]` assumes a paginated source — relax it (and add
# the locator your source supports: offset, timestamp, …) for non-paginated input.
#
# See typed-contract.md (shape) and provenance.md (content rules + the value-source
# ladder that `origin.method` names).
openapi: 3.1.0
info:
  title: Auditable extraction envelope
  version: 1.0.0
paths: {}
components:
  schemas:
    SourceRef:
      type: object
      description: >-
        Where in the source this value came from. Specific enough that a UI can
        navigate the user straight to it. Set the locator family the source
        supports.
      properties:
        page:   { type: integer, minimum: 1, description: 1-based page/sheet }
        bbox:
          type: array
          description: "[x1,y1,x2,y2] region on the page, in source pixel coords"
          items: { type: number }
          minItems: 4
          maxItems: 4
        anchor: { type: string, description: "stable id of a text/table anchor, e.g. an OCR token id" }
        table:  { type: string, description: "table/section identifier" }
        row:    { type: integer, description: "row index within table" }
      required: [page]

    Origin:
      type: object
      description: How the value was produced — the audit trail of method + inputs.
      properties:
        method:
          type: string
          description: >-
            Which rung on the value-source ladder produced this value, plus a
            domain detail. Convention "<rung>:<detail>" with rung in
            {calc, parse, lookup, detector, ocr} or the bare token "llm_estimate".
            Examples: "calc:area", "parse:line_item_qty", "detector:abnormal_range",
            "lookup:sku", "ocr:tesseract", "llm_estimate".
        inputs:
          type: array
          description: Upstream operand values, or ids of upstream records this derives from.
          items: { type: string }
        model_version:
          type: string
          nullable: true
          description: Detector/model/ruleset version — for the flywheel & reproducibility.
      required: [method]

    ExtractedValue:
      type: object
      description: >-
        The invariant envelope. Every value in the output is one of these. The
        domain payload is carried under `payload` and is defined per project.
      properties:
        key:        { type: string, description: "what this value is, e.g. wall_area" }
        value:      { type: string, description: "exact value as a string (decimal-as-string / parsed token) to avoid float drift" }
        unit:       { type: string, nullable: true }
        origin:     { $ref: '#/components/schemas/Origin' }
        source_ref: { $ref: '#/components/schemas/SourceRef' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Sourced per rung; for derived values, min(operand confidences).
            Human verification sets a separate status, not confidence = 1.
        payload:
          type: object
          additionalProperties: true
          description: >-
            DOMAIN-SPECIFIC fields for this project. Replace with a $ref to your
            project's payload schema. The envelope above never changes.
      required: [key, value, origin, source_ref, confidence]
