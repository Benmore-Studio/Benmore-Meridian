# Django Production-Ready pre-commit configuration
# Automated code quality checks before every commit

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in docker-compose
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Ruff - Fast Python linter and formatter (replaces black, flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      # Run ruff linter with auto-fix
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run ruff formatter
      - id: ruff-format

  # Mypy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - django-stubs
          - djangorestframework-stubs
          - types-requests
        args: [--ignore-missing-imports, --show-error-codes]

  # Gitleaks - Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Django-specific checks
  - repo: local
    hooks:
      # Django system check
      - id: django-check
        name: Django System Check
        entry: uv run python manage.py check
        language: system
        pass_filenames: false
        always_run: true

      # Check for missing migrations
      - id: django-migrations-check
        name: Check for missing migrations
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true

      # Run fast tests (optional - uncomment if desired)
      # - id: pytest-fast
      #   name: pytest-fast
      #   entry: uv run pytest -x --ff -q --tb=short
      #   language: system
      #   pass_filenames: false
      #   always_run: true
      #   stages: [commit]

# Configuration
default_language_version:
  python: python3.11

# Optionally skip hooks for specific commits
# Use: git commit --no-verify to skip all hooks
