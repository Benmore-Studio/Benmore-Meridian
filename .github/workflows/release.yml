name: bm CI and Release

on:
  pull_request:
    paths:
      - "bm/**"
      - "benmore_client/**"
      - "skills/**"
      - ".github/workflows/release.yml"
      - "AGENTS.md"
      - "AUTHORS.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "skills.sh.json"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "bm/**"
      - "benmore_client/**"
      - "skills/**"
      - ".github/workflows/release.yml"
      - "AGENTS.md"
      - "AUTHORS.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "skills.sh.json"

jobs:
  ci:
    name: Quality Gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ruff format
        working-directory: bm
        run: uv run ruff format --check bm/ tests/

      - name: Ruff lint
        working-directory: bm
        run: uv run ruff check bm/ tests/

      - name: mypy
        working-directory: bm
        run: uv run mypy bm/

      - name: basedpyright
        working-directory: bm
        run: uv run --extra dev basedpyright

      - name: pytest
        working-directory: bm
        run: uv run pytest tests/ -q

      - name: Rust tests
        working-directory: bm
        run: cargo test --manifest-path native/Cargo.toml

      - name: Build sdist
        working-directory: bm
        run: uv build --sdist

      - name: Build native wheel
        working-directory: bm
        run: uv run --extra dev maturin build --release --out dist

      - name: CLI schema smoke
        working-directory: bm
        run: |
          uv run bm schema json status
          uv run bm schema openapi

  build-sdist:
    name: Build release sdist
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        working-directory: bm
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: bm-sdist
          path: bm/dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build release wheels
    runs-on: ${{ matrix.os }}
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native wheel
        working-directory: bm
        run: uv run --extra dev maturin build --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: bm-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bm/dist/*.whl
          if-no-files-found: error

  release:
    name: Publish PyPI and GitHub Release
    runs-on: ubuntu-latest
    needs: [ci, build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: bm/dist
          pattern: bm-*
          merge-multiple: true

      - name: Publish to PyPI
        working-directory: bm
        run: uv publish dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            bm/dist/*
