[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benmore-bm"
version = "1.8.0"
description = "Benmore skill manager for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "benmore-client>=1.0.1",
]

[project.scripts]
bm = "bm.cli:app"

[tool.uv.sources]
benmore-client = { path = "../benmore_client", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "mypy>=1.8",
    "ruff>=0.15.10",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["bm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bm --cov-report=term-missing"
