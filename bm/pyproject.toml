[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benmore-bm"
version = "1.10.1"
description = "Benmore skill manager for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Arkash Jain", email = "arkjain@bu.edu" },
    { name = "Benmore Studio" },
]
keywords = ["agent-skills", "claude-code", "codex", "skills", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.24.1",
    "rich>=13",
    "benmore-client>=1.0.1",
]

[project.scripts]
bm = "bm.cli:app"

[project.urls]
Homepage = "https://github.com/Benmore-Studio/Benmore-Meridian"
Repository = "https://github.com/Benmore-Studio/Benmore-Meridian"
Issues = "https://github.com/Benmore-Studio/Benmore-Meridian/issues"
Skills = "https://skills.sh/Benmore-Studio/Benmore-Meridian"

[tool.uv.sources]
benmore-client = { path = "../benmore_client", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.8",
    "ruff>=0.15.10",
    "basedpyright>=1.36.0",
    "maturin>=1.8",
]

native = [
    "maturin>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["bm"]
artifacts = ["bm/schemas/*.json"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "bm._native"
python-source = "."
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bm/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bm --cov-report=term-missing"
