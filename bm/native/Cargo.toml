[package]
name = "bm-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: build one stable-ABI wheel that works on CPython 3.11+ (no
# per-version rebuilds). pyo3 >= 0.29 closes RUSTSEC advisories for < 0.29.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }

# Optimize the release extension: full LTO + a single codegen unit produce the
# smallest, fastest .so/.pyd, and strip removes debug symbols from the wheel.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
