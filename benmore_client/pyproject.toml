[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benmore-client"
version = "1.0.1"
description = "Async Python client for the Benmore project management API v2"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Benmore Technologies" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

# The package source files (__init__.py, client.py, models.py, etc.) live in
# the same directory as this pyproject.toml — a "flat" layout. Setuptools
# handles this via an explicit package-dir mapping: "benmore_client" → ".".
# This generates a .pth file at install time pointing at the parent directory
# (the monorepo root), so `import benmore_client` resolves correctly from any
# script context.
[tool.setuptools]
packages = ["benmore_client"]
package-dir = { "benmore_client" = "." }

[tool.setuptools.package-data]
benmore_client = ["py.typed"]
